name: 'AWS Credentials and Cargo Cache'
description: 'Configures Cargo target caching, S3-backed sccache, and a small Cargo download cache.'
inputs:
  target:
    description: 'Target triple.'
    required: true
  profile:
    description: 'Cargo profile used for the build.'
    required: false
    default: 'ci'
  access-key-id:
    description: 'AWS Access Key ID'
    required: true
  secret-access-key:
    description: 'AWS Secret Access Key'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Detect rust minor version
      shell: bash
      run: |
        if [[ -z "${RUST_MINOR:-}" ]]; then
          minor=$(rustc --version --verbose | sed -ne 's/^release: \([0-9]*\.[0-9]*\).*/\1/p')
          echo "RUST_MINOR=${minor:-unknown}" >> "$GITHUB_ENV"
        else
          echo "Using preset RUST_MINOR=${RUST_MINOR}"
        fi

    - name: Detect S3 cache credentials
      id: s3_cache
      shell: bash
      env:
        AWS_ACCESS_KEY_ID: ${{ inputs.access-key-id }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.secret-access-key }}
      run: |
        if [[ -n "${AWS_ACCESS_KEY_ID}" && -n "${AWS_SECRET_ACCESS_KEY}" ]]; then
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "S3_CARGO_CACHE_ENABLED=true" >> "$GITHUB_ENV"
        else
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          echo "S3_CARGO_CACHE_ENABLED=false" >> "$GITHUB_ENV"
          echo "S3 Cargo cache is disabled because credentials are unavailable."
        fi
    #
    #    - name: Configure AWS credentials via OIDC (org-wide role)
    #      uses: aws-actions/configure-aws-credentials@v4
    #      with:
    #        aws-access-key-id: ${{ inputs.access-key-id }}
    #        aws-secret-access-key: ${{ inputs.secret-access-key }}
    #        aws-region: eu-central

    - name: Install sccache
      if: steps.s3_cache.outputs.enabled == 'true'
      uses: mozilla-actions/sccache-action@v0.0.9

    - name: Configure sccache
      if: steps.s3_cache.outputs.enabled == 'true'
      shell: bash
      run: |
        if RUSTC_WRAPPER=sccache \
          SCCACHE_BUCKET=reduct-cache \
          SCCACHE_ENDPOINT=https://fsn1.your-objectstorage.com \
          SCCACHE_REGION=fsn1 \
          SCCACHE_S3_KEY_PREFIX="sccache/${{ github.repository }}/${{ inputs.target }}/${{ inputs.profile }}/rust${RUST_MINOR}" \
          SCCACHE_IDLE_TIMEOUT=0 \
          AWS_ACCESS_KEY_ID="${{ inputs.access-key-id }}" \
          AWS_SECRET_ACCESS_KEY="${{ inputs.secret-access-key }}" \
          AWS_REGION=fsn1 \
          AWS_DEFAULT_REGION=fsn1 \
          sccache --start-server; then
          {
            echo "RUSTC_WRAPPER=sccache"
            echo "SCCACHE_BUCKET=reduct-cache"
            echo "SCCACHE_ENDPOINT=https://fsn1.your-objectstorage.com"
            echo "SCCACHE_REGION=fsn1"
            echo "SCCACHE_S3_KEY_PREFIX=sccache/${{ github.repository }}/${{ inputs.target }}/${{ inputs.profile }}/rust${RUST_MINOR}"
            echo "SCCACHE_IDLE_TIMEOUT=0"
            echo "AWS_ACCESS_KEY_ID=${{ inputs.access-key-id }}"
            echo "AWS_SECRET_ACCESS_KEY=${{ inputs.secret-access-key }}"
            echo "AWS_REGION=fsn1"
            echo "AWS_DEFAULT_REGION=fsn1"
          } >> "$GITHUB_ENV"
        else
          echo "::warning::sccache server failed to start; continuing without sccache."
        fi

    - name: Use cache for Cargo downloads
      if: steps.s3_cache.outputs.enabled == 'true'
      uses: runs-on/cache@v4
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          ~/.cargo/bin/cargo-export
        key: ${{ runner.os }}-${{ inputs.target }}-${{ inputs.profile }}-cargo-downloads-rust${{ env.RUST_MINOR }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-${{ inputs.target }}-${{ inputs.profile }}-cargo-downloads-rust${{ env.RUST_MINOR }}-
      env:
        RUNS_ON_S3_BUCKET_CACHE: reduct-cache
        RUNS_ON_S3_BUCKET_ENDPOINT: https://fsn1.your-objectstorage.com
        AWS_ACCESS_KEY_ID: ${{ inputs.access-key-id }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.secret-access-key }}
        AWS_REGION: fsn1
        AWS_DEFAULT_REGION: fsn1

    - name: Use cache for Cargo target
      if: steps.s3_cache.outputs.enabled == 'true'
      uses: runs-on/cache@v4
      with:
        path: target/
        key: ${{ runner.os }}-${{ inputs.target }}-${{ inputs.profile }}-cargo-target-rust${{ env.RUST_MINOR }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-${{ inputs.target }}-${{ inputs.profile }}-cargo-target-rust${{ env.RUST_MINOR }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}-
          ${{ runner.os }}-${{ inputs.target }}-${{ inputs.profile }}-cargo-target-rust${{ env.RUST_MINOR }}-
      env:
        RUNS_ON_S3_BUCKET_CACHE: reduct-cache
        RUNS_ON_S3_BUCKET_ENDPOINT: https://fsn1.your-objectstorage.com
        AWS_ACCESS_KEY_ID: ${{ inputs.access-key-id }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.secret-access-key }}
        AWS_REGION: fsn1
        AWS_DEFAULT_REGION: fsn1
